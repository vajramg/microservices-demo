parameters:
    - name: servicename
      type: string
jobs:
    - job: build
      displayName: Build
      steps:
       - task: KubernetesManifest@1
         inputs:
           action: 'deploy'
           connectionType: 'azureResourceManager'
           azureSubscriptionConnection: 'az-resource'
           azureResourceGroup: 'aks-rg'
           kubernetesCluster: 'my-aks1988'
           namespace: 'default'
           manifests: |
           ${{ parameters.servicename }}/manifests/deployment.yaml 
           ${{ parameters.servicename }}/manifests/service.yaml 
           containers: 
             vg1988myacr.azurecr.io/${{ parameters.serviceName }}:$(Build.BuildId)

parameters:
    - name: serviceName
      type: string
    - name: environmentName
      type: string
jobs:
- deployment: deploy
  displayName: 'Deploy to AKS'
  environment: ${{parameters.environmentName}}
  variables:
  - group: common-shared
  pool:
    vmImage: 'ubuntu-latest'
  strategy:
       runOnce:
        deploy:
         steps:
         - checkout: self 
         - script: |
            echo "Current directory:"
            pwd
            echo "Repository structure:"
            ls -R
            kubectl create namepspace $(namespace)
           displayName: "Debug Repository"
         - task: KubernetesManifest@1
           inputs:
            action: 'deploy'
            connectionType: 'azureResourceManager'
            azureSubscriptionConnection: 'az-resource'
            azureResourceGroup: $(azureResourceGroup)
            kubernetesCluster: $(kubernetesCluster)
            namespace: $(namespace)
            manifests: |
             src/${{ parameters.serviceName }}/manifests/deployment.yaml
             src/${{ parameters.serviceName }}/manifests/service.yaml 
            containers: |
             $(acr).azurecr.io/${{ parameters.serviceName }}:$(Build.BuildId)